plugins {
    id 'com.android.application'
}

def automaticVersionCode = providers.gradleProperty("versionCode")
        .orElse("1")
        .get()
        .toInteger()

def automaticVersionName = providers.gradleProperty("versionName")
        .orElse("1.0.0")
        .get()

def signingKeyPath = System.getenv("KEYSTORE_PATH")

def signingKeyPassword = System.getenv("KEYSTORE_PASSWORD") ?: ""
def signingAlias = System.getenv("KEY_ALIAS") ?: "galaxystriker"
def signingPassword = System.getenv("KEY_PASSWORD") ?: ""

android {
    namespace 'com.galaxystriker.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.galaxystriker.game'
        minSdk 23
        targetSdk 28

        versionCode automaticVersionCode
        versionName automaticVersionName
    }

    signingConfigs {
        release {
            storeFile file(signingKeyPath ?: "${rootDir}/galaxy-striker-release.jks")
            storePassword signingKeyPassword
            keyAlias signingAlias
            keyPassword signingPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
