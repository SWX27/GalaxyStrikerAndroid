
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GALAXY STRIKER</title>
<style>
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030613;color:#fff;font-family:Arial,sans-serif}
canvas{display:block;width:100%;height:100%;position:absolute;inset:0}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:bold;pointer-events:none;text-shadow:0 0 8px #0ff}
.panel{background:#09162bdc;border:1px solid #1b6a91;border-radius:9px;padding:9px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#020611b8;padding:20px}
.card{text-align:center;max-width:350px;width:100%;padding:25px 18px;background:#08152a;border:1px solid #16cfff;border-radius:18px;box-shadow:0 0 35px #006aff55}
h1{font-size:30px;color:#51eaff;letter-spacing:2px;margin:0 0 12px}
p{color:#c1d7f2;line-height:1.6;font-size:14px}
button{background:#0cbce5;color:#00101b;border:0;border-radius:10px;padding:14px 22px;font-size:16px;font-weight:bold;width:100%;margin-top:10px}
#hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:#8ca8c8;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="panel">LEVEL <span id="level">1</span>/10<br>SCORE <span id="score">0</span></div>
 <div class="panel">HULL <span id="hp">100</span>%<br>WEAPON <span id="weapon">1</span></div>
 <div class="panel">ENEMIES <span id="left">0</span></div>
</div>
<div id="overlay">
 <div class="card">
  <h1 id="title">GALAXY<br>STRIKER</h1>
  <p id="message">Defend the galaxy! Survive 10 levels and defeat the bosses on levels 5 and 10.</p>
  <button id="start">START MISSION</button>
 </div>
</div>
<div id="hint">DRAG TO MOVE • AUTO FIRE • COLLECT CYAN UPGRADES</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,playing=false,level=1,score=0,hp=100,weapon=1;
let ship,stars=[],bullets=[],enemies=[],drops=[],particles=[];
let spawn=0,frame=0,boss=null,last=0,drag=false,pointer=null;
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(ship){ship.x=Math.min(W-22,Math.max(22,ship.x));ship.y=Math.min(H-60,Math.max(80,ship.y))}
 stars=Array.from({length:Math.max(45,Math.floor(W*H/8500))},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.8+.3,v:Math.random()*1.3+.3}));
}
addEventListener('resize',resize);resize();
function reset(){
 level=1;score=0;hp=100;weapon=1;frame=0;
 bullets=[];enemies=[];drops=[];particles=[];boss=null;spawn=0;
 ship={x:W/2,y:H*.78,r:15,cool:0,inv:0};
 updateHud();
}
function updateHud(){
 $('level').textContent=level;$('score').textContent=score;
 $('hp').textContent=Math.max(0,Math.ceil(hp));$('weapon').textContent=weapon;
 $('left').textContent=enemies.length+(boss?1:0);
}
function show(title,msg,button){
 $('title').innerHTML=title;$('message').textContent=msg;
 $('start').textContent=button;$('overlay').style.display='flex';
}
$('start').onclick=()=>{
 $('overlay').style.display='none';
 if(!playing){reset();playing=true;last=performance.now();requestAnimationFrame(loop)}
 else{reset();playing=true;last=performance.now();requestAnimationFrame(loop)}
};
function pointerPos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{drag=true;pointer=pointerPos(e);canvas.setPointerCapture(e.pointerId);if(ship){ship.x=pointer.x;ship.y=Math.min(H-45,Math.max(H*.35,pointer.y))}});
canvas.addEventListener('pointermove',e=>{if(drag&&ship){pointer=pointerPos(e);ship.x=Math.max(18,Math.min(W-18,pointer.x));ship.y=Math.max(65,Math.min(H-40,pointer.y))}});
function release(){drag=false;pointer=null}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
function burst(x,y,color,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:25+Math.random()*20,color})}
function shoot(){
 const offsets=weapon>=3?[-12,0,12]:weapon===2?[-7,7]:[0];
 offsets.forEach(dx=>bullets.push({x:ship.x+dx,y:ship.y-18,v:8,r:3,damage:1}));
}
function makeEnemy(){
 const isBoss=level===5||level===10;
 if(isBoss&& !boss){
  boss={x:W/2,y:95,hp:level===10?100:55,max:level===10?100:55,t:0};
  return;
 }
 if(isBoss)return;
 enemies.push({x:20+Math.random()*(W-40),y:-25,hp:level>=7?3:level>=4?2:1,
 r:10+Math.random()*5,v:1+level*.16+Math.random()*.6,t:Math.random()*6});
}
function damage(amount){if(ship.inv>0)return;hp-=amount;ship.inv=35;burst(ship.x,ship.y,'#ff496e',12);if(hp<=0){hp=0;playing=false;updateHud();show('MISSION FAILED','Score: '+score+' • You reached level '+level+'.','TRY AGAIN')}}
function nextLevel(){
 if(level>=10){playing=false;show('GALAXY SAVED!','You defeated the final boss! Final score: '+score,'PLAY AGAIN');return}
 level++;hp=Math.min(100,hp+18);weapon=Math.min(3,weapon+((level===3||level===7)?1:0));
 enemies=[];bullets=[];boss=null;spawn=0;burst(W/2,H/2,'#51eaff',30);updateHud();
}
function update(dt){
 frame+=dt;
 stars.forEach(s=>{s.y+=s.v*dt*2.2;if(s.y>H){s.y=0;s.x=Math.random()*W}});
 if(ship.cool>0)ship.cool-=dt;if(ship.inv>0)ship.inv-=dt;
 if(ship.cool<=0){shoot();ship.cool=Math.max(6,13-weapon*2)}
 spawn-=dt;
 if(spawn<=0&&!(level===5||level===10)&&enemies.length<Math.min(9,3+level)){
  makeEnemy();spawn=Math.max(15,55-level*3);
 }
 bullets.forEach(b=>b.y-=b.v*dt);
 bullets=bullets.filter(b=>b.y>-20);
 enemies.forEach(e=>{
  e.y+=e.v*dt;e.x+=Math.sin(frame*.04+e.t)*.8*dt;
  if(e.y>H+20){e.dead=true;return}
  if(Math.hypot(e.x-ship.x,e.y-ship.y)<e.r+ship.r) {e.dead=true;damage(12)}
  bullets.forEach(b=>{if(!b.dead&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){b.dead=true;e.hp--;burst(b.x,b.y,'#68eaff',3);if(e.hp<=0){e.dead=true;score+=10;burst(e.x,e.y,'#ff8b55',9);if(Math.random()<.17)drops.push({x:e.x,y:e.y,r:8})}}});
 });
 enemies=enemies.filter(e=>!e.dead);
 if(boss){
  boss.t+=dt;boss.x=W/2+Math.sin(boss.t*.025)*W*.3;boss.y=80+Math.sin(boss.t*.05)*15;
  if(Math.floor(boss.t)%48===0&&Math.floor(boss.t-dt)%48!==0){
   enemies.push({x:boss.x,y:boss.y+20,hp:1,r:7,v:2.5+level*.1,t:Math.random()*6});
  }
  bullets.forEach(b=>{if(!b.dead&&Math.hypot(b.x-boss.x,b.y-boss.y)<34){b.dead=true;boss.hp--;burst(b.x,b.y,'#ff4fda',2)}});
  if(boss.hp<=0){score+=level*100;burst(boss.x,boss.y,'#ff4fda',45);boss=null;nextLevel()}
 }
 drops.forEach(d=>{d.y+=2*dt;if(Math.hypot(d.x-ship.x,d.y-ship.y)<d.r+ship.r){d.dead=true;weapon=Math.min(3,weapon+1);hp=Math.min(100,hp+8);score+=25}});
 drops=drops.filter(d=>!d.dead&&d.y<H+15);
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);
 updateHud();
 if(!boss&&enemies.length===0&&(level===5||level===10)){makeEnemy()}
 else if(!boss&&enemies.length===0&&spawn<0&&!(level===5||level===10)){nextLevel()}
}
function drawShip(){
 if(!ship)return;
 ctx.save();ctx.translate(ship.x,ship.y);
 if(ship.inv>0&&Math.floor(ship.inv/3)%2===0){ctx.restore();return}
 ctx.shadowBlur=18;ctx.shadowColor='#31eaff';
 ctx.fillStyle='#d9fbff';ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(15,15);ctx.lineTo(0,9);ctx.lineTo(-15,15);ctx.closePath();ctx.fill();
 ctx.fillStyle='#09bce8';ctx.beginPath();ctx.moveTo(-5,13);ctx.lineTo(0,25+Math.random()*7);ctx.lineTo(5,13);ctx.fill();
 ctx.restore();
}
function draw(){
 ctx.fillStyle='#030613';ctx.fillRect(0,0,W,H);
 stars.forEach(s=>{ctx.fillStyle=`rgba(135,220,255,${.3+s.s*.3})`;ctx.fillRect(s.x,s.y,s.s,s.s*2)});
 bullets.forEach(b=>{ctx.shadowBlur=12;ctx.shadowColor='#5ff';ctx.fillStyle='#8ff';ctx.fillRect(b.x-2,b.y-8,4,10)});ctx.shadowBlur=0;
 enemies.forEach(e=>{ctx.fillStyle='#ff526f';ctx.shadowBlur=12;ctx.shadowColor='#f35';ctx.beginPath();ctx.moveTo(e.x,e.y+e.r);ctx.lineTo(e.x-e.r,e.y-e.r);ctx.lineTo(e.x+e.r,e.y-e.r);ctx.closePath();ctx.fill();ctx.shadowBlur=0});
 if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowBlur=25;ctx.shadowColor='#ff35d1';ctx.fillStyle='#b72eae';ctx.beginPath();ctx.moveTo(0,-34);ctx.lineTo(40,-8);ctx.lineTo(29,28);ctx.lineTo(0,20);ctx.lineTo(-29,28);ctx.lineTo(-40,-8);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffdaeF';ctx.fillRect(-35,-48,70,5);ctx.fillStyle='#ff2bc9';ctx.fillRect(-35,-48,70*Math.max(0,boss.hp/boss.max),5);ctx.restore()}
 drops.forEach(d=>{ctx.shadowBlur=15;ctx.shadowColor='#0ff';ctx.fillStyle='#4ff';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});
 particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/15);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;
 drawShip();
}
function loop(now){
 if(!playing)return;
 const dt=Math.min(2,(now-last)/16.67||1);last=now;
 update(dt);draw();
 if(playing)requestAnimationFrame(loop);
}
reset();draw();
})();
</script>
</body>
</html>
